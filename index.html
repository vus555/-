<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17294b">
<title>PhoneBuy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif}

/* 🎨 СИНИЙ ФОН */
body{
  background: linear-gradient(160deg, #24395f 0%, #17294b 43%, #142541 100%);
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 15%, rgba(88,124,255,.35), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(225,104,181,.22), transparent 40%);
  pointer-events:none;
  z-index:0;
}

.phone-screen{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ⚡ СТАТУС-БАР — БОЛЬШОЙ */
.statusbar{
  position:relative;z-index:10;
  height:58px;
  padding:20px 28px 0;
  display:flex;align-items:center;justify-content:space-between;
  font-weight:800;
  font-size:22px;
  color:#fff;flex-shrink:0;
}
.status-right{display:flex;align-items:center;gap:9px}

.status-right svg{
  width:22px;
  height:22px;
}

.battery{
  position:relative;
  width:34px;
  height:16px;
  border:2px solid currentColor;
  border-radius:5px;
  padding:2px;
}
.battery::after{
  content:'';
  position:absolute;
  right:-5px;top:4px;
  width:3px;height:6px;
  background:currentColor;
  border-radius:0 2px 2px 0;
}
.battery i{
  display:block;
  width:80%;height:100%;
  background:currentColor;
  border-radius:2px;
}

.battery-text{
  font-size:20px;
  font-weight:800;
  margin-left:2px;
}

/* ⚡ РАМКА (ДОК) — ЧУТЬ БОЛЬШЕ */
.dock{
  position:fixed;
  bottom:24px;
  left:12px;
  right:12px;
  height:130px;                            /* ⬆ было 112 → 130 */
  border:1px solid rgba(255,255,255,.10);
  border-radius:34px;                      /* ⬆ было 32 → 34 */
  background:rgba(255,255,255,0.06);
  box-shadow:0 10px 34px rgba(2,7,20,.18),inset 0 1px rgba(255,255,255,.10);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  z-index:15;
}
</style>
</head>
<body>

<div class="phone-screen">
  <div class="statusbar">
    <time id="clock">00:00</time>
    <div class="status-right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 19v-2M8 19v-5M12 19v-8M16 19v-11M20 19V4"/></svg>
      <span class="battery"><i></i></span>
      <b class="battery-text">84</b>
    </div>
  </div>
</div>

<nav class="dock"></nav>

<script>
function tick(){
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
