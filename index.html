<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Остров — Выживалка</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif;background:#0a1929}

#lobby{
  position:fixed;inset:0;z-index:200;
  background:linear-gradient(160deg,#1a4a6a 0%,#0d2a45 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;gap:16px;text-align:center;color:#fff;
}
#lobby h1{font-size:32px;font-weight:900;text-shadow:0 2px 8px rgba(0,0,0,.5)}
#lobby h1 span{color:#ffb300}
#lobby p{font-size:14px;opacity:.7;max-width:300px;line-height:1.5;margin-bottom:8px}
#lobby button{
  width:100%;max-width:300px;padding:16px;border:0;border-radius:16px;
  font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;
  transition:transform .15s;
}
#lobby button:active{transform:scale(.96)}
.btn-create{background:#ffb300;color:#0d2a45;box-shadow:0 8px 20px rgba(255,179,0,.4)}
.btn-join{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)!important}
#roomCode{
  display:none;font-size:22px;font-weight:900;color:#ffb300;
  background:rgba(0,0,0,.3);padding:14px 24px;border-radius:14px;
  letter-spacing:3px;border:2px dashed rgba(255,179,0,.5);
}
#joinInput{
  width:100%;max-width:300px;padding:16px;border-radius:16px;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:16px;font-weight:700;
  text-align:center;letter-spacing:2px;outline:none;display:none;
}
#lobbyStatus{font-size:14px;color:#ffb300;font-weight:700;min-height:20px}

#game{
  position:fixed;inset:0;display:none;flex-direction:column;
  background:linear-gradient(180deg,#1a4a6a 0%,#0d2a45 100%);
}
#game.active{display:flex}

.hud{
  position:absolute;top:0;left:0;right:0;z-index:10;
  padding:12px 16px;display:flex;justify-content:space-between;gap:8px;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
  pointer-events:none;
}
.hud-stat{
  background:rgba(0,0,0,.6);padding:8px 14px;border-radius:14px;
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;gap:6px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  pointer-events:auto;
}
.hud-stat b{color:#ffb300;font-size:14px}

canvas{display:block;width:100%;height:100%;touch-action:none;position:absolute;inset:0}
#three-canvas{
  position:absolute;inset:0;z-index:1;
  pointer-events:none;
}
#cv{z-index:2;background:transparent;position:absolute;inset:0}

.fishing-ui{
  position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
  z-index:15;background:rgba(0,0,0,.75);padding:16px 20px;border-radius:20px;
  color:#fff;text-align:center;display:none;backdrop-filter:blur(8px);
  border:2px solid rgba(255,179,0,.4);min-width:260px;
}
.fishing-ui.show{display:block}
.fishing-title{font-size:14px;font-weight:800;color:#ffb300;margin-bottom:12px}
.fish-bar{
  height:20px;background:rgba(255,255,255,.15);border-radius:10px;position:relative;
  overflow:hidden;margin-bottom:10px;
}
.fish-zone{
  position:absolute;top:0;bottom:0;
  background:linear-gradient(90deg,rgba(46,213,115,.5),rgba(46,213,115,.9),rgba(46,213,115,.5));
  border-radius:10px;
}
.fish-cursor{
  position:absolute;top:-3px;bottom:-3px;width:5px;background:#fff;
  border-radius:3px;box-shadow:0 0 10px #fff;
}
.fishing-hint{font-size:12px;opacity:.7;margin-top:4px}
.fishing-ui button{
  margin-top:12px;padding:12px 32px;border:0;border-radius:12px;
  background:#ffb300;color:#0d2a45;font-family:inherit;
  font-size:15px;font-weight:800;cursor:pointer;width:100%;
}
.fishing-ui button:active{transform:scale(.96)}

.shop-btn{
  position:absolute;bottom:20px;right:20px;z-index:12;
  width:60px;height:60px;border-radius:50%;border:0;
  background:#ffb300;color:#0d2a45;font-size:26px;cursor:pointer;
  box-shadow:0 8px 20px rgba(255,179,0,.4);
  display:grid;place-items:center;
  transition:transform .15s;
}
.shop-btn:active{transform:scale(.9)}

.panel{
  position:absolute;inset:0;z-index:30;
  background:rgba(0,0,0,.7);backdrop-filter:blur(10px);
  display:none;flex-direction:column;padding:24px 16px;
  color:#fff;overflow-y:auto;
}
.panel.show{display:flex}
.panel-head{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;flex-shrink:0;
}
.panel-head h2{font-size:22px;font-weight:900}
.panel-head h2 span{color:#ffb300}
.panel-close{
  width:42px;height:42px;border-radius:50%;border:0;
  background:rgba(255,255,255,.1);color:#fff;font-size:22px;
  cursor:pointer;display:grid;place-items:center;
}
.panel-close:active{transform:scale(.9)}

.shop-item{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:16px;padding:14px 16px;margin-bottom:10px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.shop-item .info{flex:1;min-width:0}
.shop-item .name{font-size:15px;font-weight:800;margin-bottom:3px}
.shop-item .desc{font-size:12px;opacity:.6;line-height:1.3}
.shop-item .price{font-size:15px;font-weight:900;color:#ffb300;white-space:nowrap;}
.shop-item button{
  padding:10px 16px;border:0;border-radius:12px;
  background:#ffb300;color:#0d2a45;font-family:inherit;
  font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;
}
.shop-item button:active{transform:scale(.94)}
.shop-item button:disabled{background:rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:not-allowed;}

.toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
  background:rgba(0,0,0,.9);color:#fff;
  padding:12px 20px;border-radius:14px;
  font-size:14px;font-weight:700;z-index:90;
  opacity:0;transition:all .3s;pointer-events:none;
  border:1px solid rgba(255,179,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="lobby">
  <h1>🏝 <span>ОСТРОВ</span></h1>
  <p>Выживи с другом на необитаемом острове. Лови рыбу, продавай, стань богатым!</p>

  <button class="btn-create" id="createBtn">🏝 Создать остров</button>
  <div id="roomCode"></div>
  <p id="lobbyStatus"></p>

  <button class="btn-join" id="showJoinBtn">🔗 Присоединиться</button>
  <input type="text" id="joinInput" placeholder="ВВЕДИ КОД" maxlength="6">
  <button class="btn-join" id="joinBtn" style="display:none">✅ Войти на остров</button>
</div>

<div id="game">
  <div class="hud">
    <div class="hud-stat">💰 <b id="hudMoney">0</b></div>
    <div class="hud-stat">🐟 <b id="hudFish">0</b></div>
    <div class="hud-stat">🍖 <b id="hudFood">100</b></div>
  </div>

  <canvas id="cv"></canvas>
  <canvas id="three-canvas"></canvas>

  <button class="shop-btn" id="shopBtn">🛒</button>

  <div class="fishing-ui" id="fishUI">
    <div class="fishing-title">🎣 Клюёт! Жми когда в зелёной зоне</div>
    <div class="fish-bar">
      <div class="fish-zone" id="fishZone"></div>
      <div class="fish-cursor" id="fishCursor"></div>
    </div>
    <div class="fishing-hint" id="fishHint">Нажми кнопку!</div>
    <button id="fishBtn">ПОЙМАТЬ!</button>
  </div>

  <div class="panel" id="shopPanel">
    <div class="panel-head">
      <h2>🛒 <span>Магазин</span></h2>
      <button class="panel-close" id="shopClose">✕</button>
    </div>
    <div id="shopList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════ КОНФИГ ═══════════════ */
const WORLD_SIZE = 2000;

/* ═══════════════ СОСТОЯНИЕ ═══════════════ */
let state = {
  money: 0,
  fish: 0,
  food: 100,
  players: {},
  me: { x: 1000, y: 1000, vx: 0, vy: 0, name: 'Ты', angle: 0 },
  fishing: null
};

const SHOP = [
  { id: 'rod', name: '🎣 Удочка', desc: 'Позволяет ловить рыбу', price: 20, oneTime: true },
  { id: 'bait', name: '🪱 Приманка x5', desc: 'Рыба клюёт чаще', price: 10 },
  { id: 'food', name: '🍞 Еда x30', desc: 'Восстановить сытость', price: 8 }
];

/* ═══════════════ СЕТЬ ═══════════════ */
let peer = null, conn = null, roomId = null, isHost = false;
const lobby = document.getElementById('lobby');
const lobbyStatus = document.getElementById('lobbyStatus');

function genCode(){ return Math.random().toString(36).substring(2,8).toUpperCase(); }

document.getElementById('createBtn').addEventListener('click',()=>{
  isHost = true;
  roomId = genCode();
  lobbyStatus.textContent = 'Создаём остров...';
  peer = new Peer('island-'+roomId);
  peer.on('open',()=>{
    document.getElementById('createBtn').style.display='none';
    document.getElementById('showJoinBtn').style.display='none';
    document.getElementById('roomCode').style.display='block';
    document.getElementById('roomCode').textContent = roomId;
    lobbyStatus.textContent = 'Ждём друга... Отправь ему код ↑';
  });
  peer.on('connection',(c)=>{ conn = c; setupConn(); });
  peer.on('error',(e)=>{ lobbyStatus.textContent = 'Ошибка: '+e.message; });
});

document.getElementById('showJoinBtn').addEventListener('click',()=>{
  document.getElementById('createBtn').style.display='none';
  document.getElementById('showJoinBtn').style.display='none';
  document.getElementById('joinInput').style.display='block';
  document.getElementById('joinBtn').style.display='block';
});

document.getElementById('joinBtn').addEventListener('click',()=>{
  const code = document.getElementById('joinInput').value.toUpperCase().trim();
  if(!code){ lobbyStatus.textContent='Введи код'; return; }
  lobbyStatus.textContent = 'Подключаемся...';
  peer = new Peer();
  peer.on('open',()=>{
    conn = peer.connect('island-'+code);
    setupConn();
  });
  peer.on('error',(e)=>{ lobbyStatus.textContent = 'Ошибка: '+e.message; });
});

function setupConn(){
  conn.on('open',()=>{
    lobby.style.display='none';
    document.getElementById('game').classList.add('active');
    initGame();
    startNetwork();
  });
  conn.on('data',(data)=>{ handleNetworkData(data); });
  conn.on('close',()=>{ showToast('Соединение потеряно'); });
}

let lastSent = 0;
function startNetwork(){
  setInterval(()=>{
    if(!conn || !conn.open) return;
    const now = Date.now();
    if(now - lastSent > 50){
      conn.send({ type:'pos', x:state.me.x, y:state.me.y, angle:state.me.angle });
      lastSent = now;
    }
  }, 50);
}

function handleNetworkData(data){
  if(data.type === 'pos'){
    state.players.friend = {
      x: data.x, y: data.y, angle: data.angle || 0,
      name: 'Друг', lastUpdate: Date.now()
    };
  }
  if(data.type === 'action'){ showToast('Друг: '+data.text); }
}

function sendAction(text){
  if(conn && conn.open) conn.send({type:'action', text});
}

/* ═══════════════ 2Д CANVAS (мир) ═══════════════ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let camX = 0, camY = 0;

function resize(){
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  if(renderer){
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  }
}
resize();
window.addEventListener('resize', resize);

/* ═══════════════ 3Д THREE.JS (персонажи) ═══════════════ */
let renderer, scene, camera;
let myCharacter, friendCharacter;

function initThree(){
  const threeCanvas = document.getElementById('three-canvas');

  renderer = new THREE.WebGLRenderer({
    canvas: threeCanvas,
    alpha: true,
    antialias: true
  });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = false;

  scene = new THREE.Scene();

  // Ортографическая камера — вид сверху под небольшим углом (2.5Д)
  const frustum = 250;
  const aspect = window.innerWidth / window.innerHeight;
  camera = new THREE.OrthographicCamera(
    -frustum * aspect / 2, frustum * aspect / 2,
    frustum / 2, -frustum / 2,
    0.1, 1000
  );

  // Свет
  const ambient = new THREE.AmbientLight(0xffffff, 0.75);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
  dirLight.position.set(5, 10, 5);
  scene.add(dirLight);

  // Мой персонаж
  myCharacter = createHumanoid(0x999999); // серый
  scene.add(myCharacter);

  // Друг (скрыт пока не подключится)
  friendCharacter = createHumanoid(0x4a9fd8); // синий для друга
  friendCharacter.visible = false;
  scene.add(friendCharacter);
}

/* Создаём человечка из примитивов */
function createHumanoid(color){
  const group = new THREE.Group();

  // Материал с желейным видом
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.6,
    metalness: 0.1
  });

  // ТЕЛО (цилиндр/капсула)
  const bodyGeo = new THREE.CapsuleGeometry(6, 10, 4, 8);
  const body = new THREE.Mesh(bodyGeo, mat);
  body.position.y = 12;
  group.add(body);

  // ГОЛОВА (сфера)
  const headGeo = new THREE.SphereGeometry(6, 12, 12);
  const head = new THREE.Mesh(headGeo, mat);
  head.position.y = 26;
  group.add(head);

  // ГЛАЗА
  const eyeGeo = new THREE.SphereGeometry(1.2, 8, 8);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x000000 });
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  eyeL.position.set(-2.2, 27, 5.5);
  group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  eyeR.position.set(2.2, 27, 5.5);
  group.add(eyeR);

  // РУКИ
  const armGeo = new THREE.CapsuleGeometry(1.8, 8, 3, 6);
  const armL = new THREE.Mesh(armGeo, mat);
  armL.position.set(-8, 14, 0);
  armL.rotation.z = 0.3;
  armL.name = 'armL';
  group.add(armL);

  const armR = new THREE.Mesh(armGeo, mat);
  armR.position.set(8, 14, 0);
  armR.rotation.z = -0.3;
  armR.name = 'armR';
  group.add(armR);

  // НОГИ
  const legGeo = new THREE.CapsuleGeometry(2, 8, 3, 6);
  const legL = new THREE.Mesh(legGeo, mat);
  legL.position.set(-3, 3, 0);
  legL.name = 'legL';
  group.add(legL);

  const legR = new THREE.Mesh(legGeo, mat);
  legR.position.set(3, 3, 0);
  legR.name = 'legR';
  group.add(legR);

  group.userData = {
    arms: { L: armL, R: armR },
    legs: { L: legL, R: legR },
    body, head,
    squash: 1,
    walkTime: 0
  };

  return group;
}

/* Желейная анимация персонажа */
function animateCharacter(char, isMoving, dt){
  if(!char) return;
  const ud = char.userData;
  ud.walkTime += dt * (isMoving ? 12 : 3);

  // Желейное дыхание — тело пульсирует
  const breathe = 1 + Math.sin(ud.walkTime) * 0.05;

  if(isMoving){
    // Покачивание при беге — руки/ноги болтаются
    const swing = Math.sin(ud.walkTime) * 0.8;
    ud.arms.L.rotation.z = 0.3 + swing;
    ud.arms.R.rotation.z = -0.3 + swing;
    ud.arms.L.rotation.x = swing * 0.4;
    ud.arms.R.rotation.x = -swing * 0.4;
    ud.legs.L.rotation.x = swing * 0.7;
    ud.legs.R.rotation.x = -swing * 0.7;

    // Растягивание тела при беге — вытягивается по направлению движения
    char.scale.set(0.95, 1.08 * breathe, 0.95);
  } else {
    // Стоит — мягкое покачивание, руки/ноги чуть опущены
    const idle = Math.sin(ud.walkTime * 0.5) * 0.15;
    ud.arms.L.rotation.z = 0.3 + idle;
    ud.arms.R.rotation.z = -0.3 - idle;
    ud.arms.L.rotation.x = idle * 0.5;
    ud.arms.R.rotation.x = -idle * 0.5;
    ud.legs.L.rotation.x = idle * 0.3;
    ud.legs.R.rotation.x = -idle * 0.3;

    // Дыхание — плавный скейл
    char.scale.set(1 + Math.sin(ud.walkTime*0.5)*0.02, breathe, 1 + Math.sin(ud.walkTime*0.5)*0.02);
  }

  // Голова чуть отдельно покачивается (эффект желе)
  ud.head.rotation.z = Math.sin(ud.walkTime * 1.2) * 0.1;
  ud.head.rotation.x = Math.sin(ud.walkTime * 0.9) * 0.08;
}

/* ═══════════════ ИНИЦИАЛИЗАЦИЯ ═══════════════ */
function initGame(){
  state.me.x = 1000;
  state.me.y = 1000;
  initThree();
  updateHUD();
  renderShop();
  gameLoop();
}

/* ═══════════════ ИГРОВОЙ ЦИКЛ ═══════════════ */
let lastTime = 0;

function gameLoop(now){
  now = now || performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  update(dt);
  render();
  renderThree();

  requestAnimationFrame(gameLoop);
}

/* Управление */
let keys = {};
let joystick = { active:false, startX:0, startY:0, curX:0, curY:0, id:null };

cv.addEventListener('pointerdown',(e)=>{
  if(e.clientX < cv.width * 0.6 && !joystick.active){
    joystick.active = true;
    joystick.startX = e.clientX;
    joystick.startY = e.clientY;
    joystick.curX = e.clientX;
    joystick.curY = e.clientY;
    joystick.id = e.pointerId;
  } else {
    handleTap(e.clientX, e.clientY);
  }
});

cv.addEventListener('pointermove',(e)=>{
  if(joystick.active && e.pointerId === joystick.id){
    joystick.curX = e.clientX;
    joystick.curY = e.clientY;
  }
});

cv.addEventListener('pointerup',(e)=>{
  if(joystick.active && e.pointerId === joystick.id){
    joystick.active = false;
    joystick.id = null;
  }
});

document.addEventListener('keydown',(e)=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',(e)=>keys[e.key.toLowerCase()]=false);

function update(dt){
  let dx = 0, dy = 0;
  const speed = 4;

  if(keys['w']||keys['ц']||keys['arrowup']) dy -= speed;
  if(keys['s']||keys['ы']||keys['arrowdown']) dy += speed;
  if(keys['a']||keys['ф']||keys['arrowleft']) dx -= speed;
  if(keys['d']||keys['в']||keys['arrowright']) dx += speed;

  if(joystick.active){
    const jdx = joystick.curX - joystick.startX;
    const jdy = joystick.curY - joystick.startY;
    const dist = Math.hypot(jdx, jdy);
    if(dist > 10){
      const clamp = Math.min(dist, 60) / 60;
      dx += (jdx/dist) * speed * clamp;
      dy += (jdy/dist) * speed * clamp;
    }
  }

  // Сглаживание движения — для желейного эффекта
  state.me.vx = (state.me.vx || 0) * 0.7 + dx * 0.3;
  state.me.vy = (state.me.vy || 0) * 0.7 + dy * 0.3;

  state.me.x = Math.max(50, Math.min(WORLD_SIZE-50, state.me.x + state.me.vx));
  state.me.y = Math.max(50, Math.min(WORLD_SIZE-50, state.me.y + state.me.vy));

  // Угол поворота — по направлению движения
  if(Math.abs(state.me.vx) > 0.3 || Math.abs(state.me.vy) > 0.3){
    state.me.angle = Math.atan2(state.me.vy, state.me.vx);
  }

  camX = state.me.x - cv.width/2;
  camY = state.me.y - cv.height/2;

  if(Math.random() < 0.0005){
    state.food = Math.max(0, state.food - 1);
    updateHUD();
  }
}

function render(){
  ctx.fillStyle = '#1a4a6a';
  ctx.fillRect(0,0,cv.width,cv.height);

  ctx.save();
  ctx.translate(-camX, -camY);

  // Остров
  ctx.fillStyle = '#e6c68a';
  ctx.beginPath();
  ctx.arc(1000, 1000, 550, 0, Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#7ab648';
  ctx.beginPath();
  ctx.arc(1000, 1000, 400, 0, Math.PI*2);
  ctx.fill();

  // Пальмы
  drawPalm(800, 800);
  drawPalm(1200, 850);
  drawPalm(950, 1250);

  // Тени игроков (в 2Д слое)
  ctx.beginPath();
  ctx.ellipse(state.me.x, state.me.y + 5, 14, 6, 0, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.fill();

  if(state.players.friend){
    const f = state.players.friend;
    ctx.beginPath();
    ctx.ellipse(f.x, f.y + 5, 14, 6, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fill();
  }

  ctx.restore();

  if(joystick.active){
    ctx.beginPath();
    ctx.arc(joystick.startX, joystick.startY, 50, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,.3)';
    ctx.lineWidth = 3;
    ctx.stroke();

    const jdx = joystick.curX - joystick.startX;
    const jdy = joystick.curY - joystick.startY;
    const dist = Math.hypot(jdx, jdy);
    const maxDist = 50;
    const cx = dist > maxDist ? joystick.startX + (jdx/dist)*maxDist : joystick.curX;
    const cy = dist > maxDist ? joystick.startY + (jdy/dist)*maxDist : joystick.curY;

    ctx.beginPath();
    ctx.arc(cx, cy, 20, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,179,0,.7)';
    ctx.fill();
  }
}

function drawPalm(x, y){
  ctx.fillStyle = '#7a4a2a';
  ctx.fillRect(x-5, y-40, 10, 60);
  ctx.fillStyle = '#2d8a3a';
  for(let i=0; i<5; i++){
    const angle = (Math.PI*2/5)*i;
    ctx.beginPath();
    ctx.ellipse(x + Math.cos(angle)*25, y - 50 + Math.sin(angle)*15, 25, 10, angle, 0, Math.PI*2);
    ctx.fill();
  }
}

/* ═══════════════ 3Д РЕНДЕР ═══════════════ */
const frustumSize = 250;

function renderThree(){
  if(!renderer || !camera) return;

  // Позиция камеры — сверху под углом 45°
  camera.position.set(
    state.me.x,
    160,
    state.me.y + 120
  );
  camera.lookAt(state.me.x, 0, state.me.y);

  // Мой персонаж
  if(myCharacter){
    myCharacter.position.set(state.me.x, 8, state.me.y);
    myCharacter.rotation.y = -state.me.angle + Math.PI/2;

    const speed = Math.hypot(state.me.vx || 0, state.me.vy || 0);
    const isMoving = speed > 0.5;
    animateCharacter(myCharacter, isMoving, 0.016);
  }

  // Друг
  if(friendCharacter){
    if(state.players.friend){
      friendCharacter.visible = true;
      friendCharacter.position.set(state.players.friend.x, 8, state.players.friend.y);
      friendCharacter.rotation.y = -(state.players.friend.angle || 0) + Math.PI/2;
      animateCharacter(friendCharacter, true, 0.016);
    } else {
      friendCharacter.visible = false;
    }
  }

  renderer.render(scene, camera);
}

/* ═══════════════ РЫБАЛКА ═══════════════ */
let fishingState = null;

function handleTap(x, y){
  const worldX = x + camX;
  const worldY = y + camY;
  const dist = Math.hypot(worldX - 1000, worldY - 1000);

  if(dist > 550){
    if(!hasRod()){ showToast('Нужна удочка! Купи в магазине 🛒'); return; }
    startFishing();
  }
}

function hasRod(){ return window._hasRod || false; }

function startFishing(){
  if(fishingState) return;
  fishingState = {
    cursorPos: 0,
    direction: 1,
    zoneStart: 40 + Math.random()*30,
    zoneSize: 25,
    speed: 1.2
  };
  document.getElementById('fishUI').classList.add('show');
  updateFishingUI();
  animateFishing();
}

function animateFishing(){
  if(!fishingState) return;
  fishingState.cursorPos += fishingState.direction * fishingState.speed;
  if(fishingState.cursorPos >= 100){ fishingState.cursorPos = 100; fishingState.direction = -1; }
  if(fishingState.cursorPos <= 0){ fishingState.cursorPos = 0; fishingState.direction = 1; }
  updateFishingUI();
  requestAnimationFrame(animateFishing);
}

function updateFishingUI(){
  document.getElementById('fishZone').style.left = fishingState.zoneStart + '%';
  document.getElementById('fishZone').style.width = fishingState.zoneSize + '%';
  document.getElementById('fishCursor').style.left = fishingState.cursorPos + '%';
}

document.getElementById('fishBtn').addEventListener('click',()=>{
  if(!fishingState) return;
  const inZone = fishingState.cursorPos >= fishingState.zoneStart &&
                 fishingState.cursorPos <= fishingState.zoneStart + fishingState.zoneSize;
  if(inZone){
    state.fish += 1;
    state.money += 3;
    showToast('🎣 Поймал рыбу! +1 рыба, +3 монеты');
    sendAction('поймал рыбу');
  } else {
    showToast('😢 Сорвалась...');
  }
  fishingState = null;
  document.getElementById('fishUI').classList.remove('show');
  updateHUD();
});

/* ═══════════════ HUD ═══════════════ */
function updateHUD(){
  document.getElementById('hudMoney').textContent = state.money;
  document.getElementById('hudFish').textContent = state.fish;
  document.getElementById('hudFood').textContent = state.food;
}

/* ═══════════════ МАГАЗИН ═══════════════ */
const shopPanel = document.getElementById('shopPanel');
document.getElementById('shopBtn').addEventListener('click',()=>{
  shopPanel.classList.add('show');
  renderShop();
});
document.getElementById('shopClose').addEventListener('click',()=>{
  shopPanel.classList.remove('show');
});

function renderShop(){
  const list = document.getElementById('shopList');
  list.innerHTML = '';
  SHOP.forEach(item=>{
    const div = document.createElement('div');
    div.className = 'shop-item';
    let canBuy = state.money >= item.price;
    let owned = false;
    if(item.id === 'rod' && window._hasRod){ owned = true; canBuy = false; }
    div.innerHTML = `
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="desc">${item.desc}</div>
      </div>
      <div class="price">💰 ${item.price}</div>
      <button ${canBuy?'':'disabled'} data-id="${item.id}">
        ${owned?'Куплено':'Купить'}
      </button>
    `;
    list.appendChild(div);
  });
  list.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click',()=>buyItem(btn.dataset.id));
  });
}

function buyItem(id){
  const item = SHOP.find(i=>i.id===id);
  if(!item) return;
  if(state.money < item.price){ showToast('Не хватает монет'); return; }
  state.money -= item.price;
  if(id === 'rod'){
    window._hasRod = true;
    showToast('🎣 Теперь можешь ловить рыбу! Тапни по воде');
  }
  if(id === 'bait'){
    window._bait = (window._bait||0) + 5;
    showToast('🪱 +5 приманок');
  }
  if(id === 'food'){
    state.food = Math.min(100, state.food + 30);
    showToast('🍞 +30 сытости');
  }
  updateHUD();
  renderShop();
}

/* ═══════════════ TOAST ═══════════════ */
let toastTimer = null;
function showToast(text){
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
