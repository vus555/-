<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17294b">
<title>PhoneBuy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;overflow:hidden;font-family:'Nunito',sans-serif}

/* 🎨 СИНИЙ ФОН */
body{
  background: linear-gradient(160deg, #24395f 0%, #17294b 43%, #142541 100%);
  position:relative;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 15% 15%, rgba(88,124,255,.35), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(225,104,181,.22), transparent 40%);
  pointer-events:none;
  z-index:0;
}

.phone-screen{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
}

/* ⚡ СТАТУС-БАР */
.statusbar{
  position:relative;z-index:10;
  height:50px;
  padding:16px 26px 0;
  display:flex;align-items:center;justify-content:space-between;
  font-weight:800;
  font-size:17px;
  color:#fff;flex-shrink:0;
}
.status-right{display:flex;align-items:center;gap:7px}
.status-right svg{width:17px;height:17px}

.battery{
  position:relative;
  width:26px;height:13px;
  border:1.7px solid currentColor;
  border-radius:4px;padding:1.7px;
}
.battery::after{
  content:'';position:absolute;
  right:-4px;top:3.5px;
  width:2.5px;height:5px;
  background:currentColor;border-radius:0 2px 2px 0;
}
.battery i{display:block;width:80%;height:100%;background:currentColor;border-radius:1.7px}
.battery-text{font-size:15px;font-weight:800;margin-left:2px}

/* ⚡ ИКОНКИ — ПОДНЯТЫ ВЫШЕ */
.desktop{
  flex:1;
  padding:42px 8px 10px;              /* ⬆ было 55 → 42 (выше) */
  overflow-y:auto;
  scrollbar-width:none;
}
.desktop::-webkit-scrollbar{display:none}

.app-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  justify-items:center;
  gap:22px 4px;
  margin-bottom:20px;
}

.app-item{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  background:transparent;border:0;padding:0;
  cursor:pointer;font-family:inherit;
  width:100%;max-width:100px;
  -webkit-tap-highlight-color:transparent;
}

.app-icon-wrap{position:relative;width:clamp(72px,20vw,86px);aspect-ratio:1}

.app-icon{
  position:absolute;inset:0;
  border-radius:33%;
  background:var(--app-color);
  overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.12);
  display:grid;place-items:center;
}
.app-icon::before{
  content:'';position:absolute;
  inset:1px 1px 50% 1px;
  border-radius:33% 33% 45% 45%;
  background:linear-gradient(180deg, rgba(255,255,255,.4), transparent);
  pointer-events:none;z-index:2;
}
.app-icon svg{
  position:relative;z-index:3;
  width:58%;height:58%;color:#fff;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
}

.app-label{
  font-weight:700;font-size:12.5px;line-height:1.15;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);text-align:center;width:100%;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ⚡ ДОК */
.dock{
  position:fixed;
  bottom:24px;
  left:12px;
  right:12px;
  height:118px;
  padding:14px 8px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  gap:4px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:32px;
  background:rgba(255,255,255,0.06);
  box-shadow:0 10px 34px rgba(2,7,20,.18),inset 0 1px rgba(255,255,255,.10);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  z-index:15;
}

.dock-item{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  background:transparent;border:0;padding:0;
  cursor:pointer;font-family:inherit;
  width:100%;max-width:80px;
  -webkit-tap-highlight-color:transparent;
}

.dock-app{
  position:relative;
  width:clamp(60px,17vw,72px);aspect-ratio:1;
  border-radius:33%;background:var(--app-color);
  overflow:visible;
  display:grid;place-items:center;
  box-shadow:0 6px 14px rgba(0,0,0,.35),0 3px 6px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.12);
}
.dock-app svg{
  position:relative;z-index:3;
  width:58%;height:58%;color:#fff;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));
}

.dock-label{
  font-weight:700;font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);
  text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

.dock-badge{
  position:absolute;top:-6px;right:-6px;z-index:10;min-width:23px;height:23px;padding:0 6px;
  display:grid;place-items:center;border-radius:999px;color:#fff;background:#ff3b30;
  border:2.5px solid #24395f;font-size:12px;font-weight:800;
}
</style>
</head>
<body>

<div class="phone-screen">
  <div class="statusbar">
    <time id="clock">00:00</time>
    <div class="status-right">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 19v-2M8 19v-5M12 19v-8M16 19v-11M20 19V4"/></svg>
      <span class="battery"><i></i></span>
      <b class="battery-text">84</b>
    </div>
  </div>

  <div class="desktop">
    <div class="app-grid">

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#E57328">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M6 20 L10 8 L38 8 L42 20 Z" fill="#fff"/>
              <rect x="9" y="8" width="4" height="12" fill="#E57328" opacity="0.9"/>
              <rect x="17" y="8" width="4" height="12" fill="#E57328" opacity="0.9"/>
              <rect x="25" y="8" width="4" height="12" fill="#E57328" opacity="0.9"/>
              <rect x="33" y="8" width="4" height="12" fill="#E57328" opacity="0.9"/>
              <path d="M6 20 L7 23 L41 23 L42 20 Z" fill="#fff" opacity="0.85"/>
              <rect x="9" y="23" width="30" height="17" fill="#fff"/>
              <rect x="20" y="30" width="8" height="10" fill="#E57328"/>
              <circle cx="26" cy="35" r="0.8" fill="#fff"/>
              <rect x="12" y="26" width="6" height="7" fill="#E57328" opacity="0.85" rx="0.8"/>
              <rect x="13.5" y="27.5" width="3" height="4" fill="#fff" rx="0.4"/>
              <rect x="30" y="26" width="6" height="7" fill="#E57328" opacity="0.85" rx="0.8"/>
              <rect x="31.5" y="27.5" width="3" height="4" fill="#fff" rx="0.4"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Маркетплейс</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#8A6240">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="m6 18 18-10 18 10-18 10-18-10Z" fill="#fff"/>
              <path d="M6 18v14l18 10 18-10V18M24 28v14" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Склад</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#D93E56">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M6 18 8 8h32l2 10v2a4 4 0 0 1-8 0 4 4 0 0 1-8 0 4 4 0 0 1-8 0 4 4 0 0 1-8 0v-2Z" fill="#fff"/>
              <path d="M9 22v18h30V22M18 40v-8h12v8" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Магазины</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#8657CC">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="20" cy="16" r="6" fill="#fff"/>
              <path d="M8 38a12 12 0 0 1 24 0" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/>
              <circle cx="34" cy="20" r="4" fill="#fff" opacity="0.85"/>
              <path d="M32 30a8 8 0 0 1 8 8" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Сотрудники</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#D9A207">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M12 8h18l6 6v26H12z" fill="#fff"/>
              <path d="M30 8v6h6" stroke="#D9A207" stroke-width="2" fill="none"/>
              <line x1="18" y1="22" x2="30" y2="22" stroke="#D9A207" stroke-width="2.5"/>
              <line x1="18" y1="28" x2="30" y2="28" stroke="#D9A207" stroke-width="2.5"/>
              <line x1="18" y1="34" x2="26" y2="34" stroke="#D9A207" stroke-width="2.5"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Заметки</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#2E75CC">
            <svg viewBox="0 0 48 48" fill="none">
              <circle cx="24" cy="24" r="14" stroke="#fff" stroke-width="2.5" fill="none"/>
              <ellipse cx="24" cy="24" rx="6" ry="14" stroke="#fff" stroke-width="2" fill="none"/>
              <line x1="10" y1="24" x2="38" y2="24" stroke="#fff" stroke-width="2.5"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Сайт</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#199F7C">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M12 40V18l12-8 12 8v22" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
              <rect x="20" y="28" width="8" height="12" fill="#fff"/>
              <rect x="16" y="22" width="3" height="3" fill="#fff"/>
              <rect x="29" y="22" width="3" height="3" fill="#fff"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Недвижимость</span>
      </div>

      <div class="app-item">
        <span class="app-icon-wrap">
          <span class="app-icon" style="--app-color:#D89A14">
            <svg viewBox="0 0 48 48" fill="none">
              <rect x="6" y="14" width="22" height="16" fill="#fff" rx="1.5"/>
              <path d="M28 20 L38 20 L42 26 L42 30 L28 30 Z" fill="#fff"/>
              <circle cx="14" cy="34" r="4" fill="#fff" stroke="#D89A14" stroke-width="2"/>
              <circle cx="34" cy="34" r="4" fill="#fff" stroke="#D89A14" stroke-width="2"/>
            </svg>
          </span>
        </span>
        <span class="app-label">Доставка</span>
      </div>

    </div>
  </div>
</div>

<nav class="dock">
  <div class="dock-item">
    <span class="dock-app" style="--app-color:#2FB855">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.5 5 5.2c-.8.5-1.1 1.5-.8 2.4 2 6 5.7 9.7 11.7 11.7.9.3 1.9 0 2.4-.8l1.7-3-3.8-2.3-1.7 2c-2.3-1-4.5-3.2-5.5-5.5l2-1.7L8 3.5Z"/></svg>
    </span>
    <span class="dock-label">Телефон</span>
  </div>

  <div class="dock-item">
    <span class="dock-app" style="--app-color:#2B8EF0">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 11.5a7.3 7.3 0 0 1-7.7 7.3 8.2 8.2 0 0 1-3.6-.8L4 19.5l1.4-4.1A7 7 0 0 1 4.7 12 7.3 7.3 0 0 1 12.3 4 7.3 7.3 0 0 1 20 11.5Z"/>
      </svg>
      <span class="dock-badge">1</span>
    </span>
    <span class="dock-label">Сообщения</span>
  </div>

  <div class="dock-item">
    <span class="dock-app" style="--app-color:#E57328">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m4 9 1.4-4h13.2L20 9v2.1a2.5 2.5 0 0 1-4 2 2.5 2.5 0 0 1-4 0 2.5 2.5 0 0 1-4 0 2.5 2.5 0 0 1-4-2V9Z" fill="currentColor" stroke="none"/><path d="M5.5 13.1V20h13v-6.9M9 20v-4h6v4"/></svg>
    </span>
    <span class="dock-label">Маркет</span>
  </div>

  <div class="dock-item">
    <span class="dock-app" style="--app-color:#9E6538">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
        <path d="M4.5 7.5h13A2.5 2.5 0 0 1 20 10v8.5H4.5A2.5 2.5 0 0 1 2 16V8.5A2.5 2.5 0 0 1 4.5 6H18"/>
        <path d="M15.5 13h4.5v3h-4.5a1.5 1.5 0 1 1 0-3Z" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="dock-label">Кошелёк</span>
  </div>
</nav>

<script>
function tick(){
  const n = new Date();
  document.getElementById('clock').textContent =
    String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
